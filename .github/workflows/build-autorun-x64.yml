          #!/usr/bin/env python3
          """Decode the saved process snapshot offline. No running Switch required."""
          import argparse,bisect,json,struct
          from pathlib import Path
          from pe_symbols import table,resolve
          
          class Snapshot:
           def __init__(self,path):
            data=Path(path).read_bytes()
            if len(data)>16*1024*1024 or len(data)<40:raise ValueError('Invalid dump size')
            magic,version,count,self.tick,self.flags,total=struct.unpack_from('<8sIIQQQ',data)
            if magic!=b'P3RDMP1\0' or version!=1 or total!=len(data):raise ValueError('Invalid dump header or incomplete copy')
            self.records=[];pos=40
            for _ in range(count):
             if pos>len(data)-24:raise ValueError('Truncated record')
             typ,tag,addr,size=struct.unpack_from('<IIQQ',data,pos);pos+=24
             if size>len(data)-pos:raise ValueError('Record outside dump')
             self.records.append((typ,tag,addr,data[pos:pos+size]));pos+=size
            if pos!=len(data):raise ValueError('Unexpected trailing data')
            self.mem=[(addr,body) for typ,tag,addr,body in self.records if typ==2]
            self.modules=[]
            for typ,tag,addr,body in self.records:
             if typ==6 and len(body)==144:
              base,size=struct.unpack_from('<QQ',body);name=body[16:].decode('utf-16le').split('\0',1)[0]
              self.modules.append({'name':name,'base':base,'size':size})
           def read(self,address,size):
            if size<0 or size>1024*1024:raise ValueError('Read limit')
            out=bytearray()
            while len(out)<size:
             a=address+len(out)
             for base,data in self.mem:
              if base<=a<base+len(data):
               n=min(size-len(out),base+len(data)-a);out.extend(data[a-base:a-base+n]);break
             else:raise KeyError('Address not captured: '+hex(a))
            return bytes(out)
           def u64(self,address):return struct.unpack('<Q',self.read(address,8))[0]
          
          def analyze(s,symbol_dir):
           cache={};missing=[]
           build=next((body.rstrip(b'\0').decode(errors='replace') for typ,tag,addr,body in s.records if typ==5),'unknown')
           native_base=next((addr for typ,tag,addr,body in s.records if typ==5),0)
           native=None
           try:
            native=json.loads((symbol_dir/'runtime-symbols.json').read_text())
            if native['build_id']!=build:native=None;missing.append('Native symbols do not match build')
           except OSError:pass
           def name(address):
            for m in s.modules:
             if m['base']<=address<m['base']+m['size']:
              module=m['name'];file=symbol_dir/module.lower()
