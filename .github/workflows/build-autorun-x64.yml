          static void p3r_pe_name(uint64_t address, char *name, unsigned capacity)
          {
              uint64_t candidate=address & ~65535ULL;
              unsigned count;
              snprintf(name,capacity,"%#llx",(unsigned long long)address);
              for (count=0;count<1024 && candidate;count++,candidate-=65536) {
                  uint16_t mz,magic;
                  uint32_t pe,sig,size,export_rva,export_name;
                  char module[64];unsigned i;
                  if (!p3r_pe_native_read(0,candidate,&mz,2) || mz!=0x5a4d ||
                      !p3r_pe_native_read(0,candidate+0x3c,&pe,4) || pe>0x1000 ||
                      !p3r_pe_native_read(0,candidate+pe,&sig,4) || sig!=0x4550 ||
                      !p3r_pe_native_read(0,candidate+pe+24,&magic,2) || magic!=0x20b ||
                      !p3r_pe_native_read(0,candidate+pe+24+56,&size,4) || size>0x4000000 ||
                      address-candidate>=size || size<0x1000) continue;
                  if (!p3r_pe_native_read(0,candidate+pe+24+112,&export_rva,4) ||
                      !export_rva || export_rva>size-40 ||
                      !p3r_pe_native_read(0,candidate+export_rva+12,&export_name,4) ||
                      !export_name || export_name>=size) {
                      snprintf(name,capacity,"PE@%#llx+%#llx",(unsigned long long)candidate,
                               (unsigned long long)(address-candidate));return;
                  }
                  for (i=0;i<sizeof(module)-1 && export_name+i<size;i++) {
                      if (!p3r_pe_native_read(0,candidate+export_name+i,module+i,1)) break;
                      if (!module[i]) break;
                      if ((unsigned char)module[i]<32 || (unsigned char)module[i]>126) break;
                  }
                  module[i]=0;
                  snprintf(name,capacity,"%s@%#llx+%#llx",module[0]?module:"PE",
                           (unsigned long long)candidate,(unsigned long long)(address-candidate));return;
              }
          }
          
          static void p3r_pe_report(uint64_t serial, unsigned tid)
          {
              static uint64_t reported[8];
              static unsigned count;
              struct p3r_pe_wait s;
              uint64_t nt_base=0x180000000ULL;
