          void wine_nx_quit_point(void) __attribute__((weak));
          void wine_nx_quit_point(void) {wine_nx_quit_requested=0;}
          static Result answers[8];static int called;static long long received[8];
          static void horizon_p3r_report_waits(void);
          static Result svcWaitForAddress(void *a,unsigned arb,long long v,long long t){
           assert(a && arb==2 && v==0);received[called]=t;now_ns+=2000000000ULL;
           horizon_p3r_report_waits();return answers[called++];}
          static Result svcSignalToAddress(void *a,unsigned t,long long v,int count){
           assert(a && t==0 && v==0 && count==3);return 77;}
          
          P3R_FILE_4_END
          cat > "$CLOUD_ROOT/p3r-source/futex_test_main.inc" <<'P3R_FILE_5_END'
          int main(void){
           int word=0;struct p3r_diag_snapshot s;unsigned i,seen=0;
           horizon_p3r_wait_context(1,0,0);errno=EBUSY;
           answers[0]=(7<<9)|1;answers[1]=(7<<9)|1;answers[2]=0;
           assert(horizon_futex_wait(&word,0,-1)==0 && called==3 && errno==EBUSY);
           for(i=0;i<3;i++)assert(received[i]==250000000LL);
           assert(log_lines>=3);
           called=0;answers[0]=(7<<9)|1;
           assert(horizon_futex_wait(&word,0,1234)==-1 && called==1 && received[0]==1234 && errno==ETIMEDOUT);
           called=0;answers[0]=(8<<9)|1;
           assert(horizon_futex_wait(&word,0,-1)==-1 && called==1 && errno==EAGAIN);
           called=0;answers[0]=2;
           assert(horizon_futex_wait(&word,0,-1)==-1 && called==1 && errno==EINVAL);
           horizon_futex_wake(&word,3);
           for(i=0;i<P3R_DIAG_SLOTS;i++)if(p3r_diag_read(p3r_diag_events+i,&s)&&s.kind==32){
            assert(s.last_rc==77 && s.expected==3 && s.address==(uintptr_t)&word);seen++;}
           assert(seen==1);
           puts("PASS: unchanged infinite slices, finite timeout, success, EAGAIN, ETIMEDOUT, EINVAL; active capture and wake kernel result");return 0;}
          P3R_FILE_5_END
          cat > "$CLOUD_ROOT/p3r-source/symbolicate_profile.py" <<'P3R_FILE_6_END'
          #!/usr/bin/env python3
          """Resolve only native runtime offsets, against the matching diagnostic build."""
          import argparse
          import bisect
          import json
          import re
          from pathlib import Path
          
          def resolve(symbols, address):
              starts = [row['address'] for row in symbols]
              i = bisect.bisect_right(starts, address)-1
              while i >= 0 and address - symbols[i]['address'] < 1048576:
                  row = symbols[i]
                  limit = row['address']+row['size'] if row['size'] else (starts[i+1] if i+1<len(starts) else row['address'])
                  if row['address'] <= address < limit:
                      return row['name'] + '+0x%x' % (address-row['address'])
                  i -= 1
              return 'unresolved'
          
          def symbolicate(table, text):
              build_id = table['build_id']
              if f'[P3R-DIAG] wait-snapshot-r1 id={build_id};' not in text:
                  raise ValueError('Profile does not identify this diagnostic build; refusing to guess symbols')
              bounds=re.search(r'\[PROF\].*?runtime (0x[0-9a-fA-F]+)-(0x[0-9a-fA-F]+)',text)
              native_base,native_end=(int(v,16) for v in bounds.groups()) if bounds else (0,0)
              results=[]
              for n,line in enumerate(text.splitlines(),1):
                  if '[PROF]' not in line and '[P3R-WAIT]' not in line and '[STALL]' not in line:
                      continue
                  if re.search(r'\b(?:pe|x86|x86 callers|x86 frames):',line):
                      continue
                  values=set(int(v,16) for v in re.findall(r'\+(0x[0-9a-fA-F]+)',line))
                  values.update(int(v,16) for v in re.findall(r'caller_offset=(0x[0-9a-fA-F]+)',line))
                  if '[STALL]' in line:
                      values=set()
                      for value in re.findall(r'(?:at |lr=|< )(0x[0-9a-fA-F]+)',line):
                          address=int(value,16)
                          if native_base <= address < native_end:
                              values.add(address-native_base)
                  for address in sorted(values):
                      results.append({'line':n,'offset':hex(address),'symbol':resolve(table['symbols'],address)})
              return {'build_id':build_id,'native_runtime_sha256':table['runtime_sha256'],'addresses':results}
          
          if __name__=='__main__':
              p=argparse.ArgumentParser(description=__doc__)
              p.add_argument('symbols',type=Path);p.add_argument('profile',type=Path)
              p.add_argument('--output',type=Path)
              args=p.parse_args()
              report=symbolicate(json.loads(args.symbols.read_text()),args.profile.read_text(errors='replace'))
              text=json.dumps(report,indent=2,ensure_ascii=False)+'\n'
              if args.output:args.output.write_text(text)
              else:print(text,end='')
          P3R_FILE_6_END
          cat > "$CLOUD_ROOT/p3r-source/collect_runtime.py" <<'P3R_FILE_7_END'
          #!/usr/bin/env python3
          """Validate the complete build, then export only its NRO update and symbols."""
          import argparse
          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import re
          import shutil
          import subprocess
          from zipfile import ZipFile, ZIP_DEFLATED
          
          def collect(root, cloud, llvm):
              spec=importlib.util.spec_from_file_location('cloud_helper',cloud/'cloud_helper.py')
              helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
              archives=list((root/'horizon-wine/build-autorun').glob('autorun-*.zip'))
              if len(archives)!=1:raise ValueError('Expected one completely packaged upstream runtime')
              checked=helper.validate_runtime(archives[0])
              lock=json.loads((cloud/'diagnostics/p3r-wait-source-lock.json').read_text())
              build_id=lock['build_id']
              with ZipFile(archives[0]) as z:
                  nro=z.read('switch/wine/wine-nx-runtime.nro')
              marker=f'[P3R-DIAG] wait-snapshot-r1 id={build_id}; native observation only'.encode()
              if marker not in nro or b'[P3R-WAIT]' not in nro:
                  raise ValueError('Diagnostic marker absent from the compiled NRO')
              digest=hashlib.sha256(nro).hexdigest()
              elf=root/'horizon-wine/build-switch-amd64/wine-nx-runtime.elf'
              if not elf.is_file():raise ValueError('Matching native ELF is missing')
              nm=subprocess.check_output([str(llvm/'bin/llvm-nm'),'--numeric-sort','--print-size','--defined-only',str(elf)],text=True)
              symbols=[]
              for line in nm.splitlines():
                  m=re.fullmatch(r'([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+([tTwW])\s+(.+)',line)
                  if m:symbols.append({'address':int(m[1],16),'size':int(m[2],16),'name':m[4]})
              required={'horizon_futex_wait','horizon_p3r_report_waits','NtWaitForAlertByThreadId'}
              if not required.issubset({s['name'] for s in symbols}):
                  raise ValueError('Native ELF is stripped or incomplete; required wait symbols missing')
              out=cloud/'dist';out.mkdir(exist_ok=True)
              symbols_dir=cloud/'symbols';symbols_dir.mkdir(exist_ok=True)
              filename=f'Autorun_P3R_Runtime_Diagnostic_{build_id}.zip'
              with ZipFile(out/filename,'w',ZIP_DEFLATED,compresslevel=6) as z:
                  z.writestr('switch/wine/wine-nx-runtime.nro',nro)
              with ZipFile(out/filename) as z:
                  if z.testzip() or z.namelist()!=['switch/wine/wine-nx-runtime.nro']:
                      raise ValueError('Unexpected runtime update contents')
                  if hashlib.sha256(z.read(z.namelist()[0])).hexdigest()!=digest:raise ValueError('NRO readback mismatch')
              shutil.copy2(elf,symbols_dir/elf.name)
              (symbols_dir/'runtime-symbols.txt').write_text(nm)
              (symbols_dir/'runtime-symbols.json').write_text(json.dumps({'build_id':build_id,'runtime_sha256':digest,'symbols':symbols},indent=2)+'\n')
              for name in ['symbolicate_profile.py','patch_runtime.py','p3r_wait_diag.h']:
                  shutil.copy2(cloud/'p3r-source'/name,symbols_dir/name)
              for name in ['p3r-wait-source-lock.json','p3r-wait-diagnostic.patch','source-lock.json','cloud-portability.patch']:
                  shutil.copy2(cloud/'diagnostics'/name,symbols_dir/name)
              instructions=f'''Диагностический Autorun для уже настроенной среды nx-amd64-fex-2640.
          Сборка {build_id}; это сбор наблюдений, исправление зависания пока не заявлено.
          
          1. Полностью закрыть Autorun. Сохранить прежний SD:/switch/wine/wine-nx-runtime.nro
             на компьютере для отката.
          2. Распаковать {filename} в корень SD с заменой ОДНОГО файла:
             switch/wine/wine-nx-runtime.nro.
          3. Запустить консоль через уже настроенную запись Hekate -> Autorun.
             Повторный Quick setup не требуется. Загрузочные компоненты в этом ZIP отсутствуют.
          4. У Persona: FEX_SMCCHECKS=Full, Profiler=On, Verbose traces=Off.
             Остальные параметры сохранить. Запустить P3R на две минуты.
          5. Полностью закрыть Autorun. Передать P3R_profiler.log из switch/wine/logs/.
             В начале должен быть маркер [P3R-DIAG] wait-snapshot-r1 id={build_id};.
          6. Для расшифровки адресов нужен парный artifact autorun-p3r-symbols того же
             запуска GitHub Actions. Его сохранить на компьютере; на SD он не нужен.
          
          Эта замена не требует копирования игры, EXE, DLL или повторной настройки памяти.
          Она записывает текущее ожидание, тип, ключ, последние вызовы пробуждения и
          поздние снимки потоков. История ограничена: отсутствие wake в ней само по себе
          не доказывает, что сигнал никогда не посылался. Слово объекта читается как
          диагностический снимок и может меняться; оно не является доказанным ID владельца.
          
          Откат: вернуть сохраненный wine-nx-runtime.nro. На реальном Switch этот новый
          NRO еще не проверен. Сборка и проверки на ПК не доказывают запуск P3R.
          '''
              (out/'INSTALL_RU.txt').write_text(instructions)
              report={'diagnostic':'wait-snapshot-r1','build_id':build_id,'native_runtime_sha256':digest,
                      'native_runtime_bytes':len(nro),'native_symbols':len(symbols),'update_archive':filename,
                      'cloud_compilation_finished':True,'complete_upstream_package_validation':checked,
                      'switch_runtime_verified':False,'p3r_boot_verified':False,'deadlock_fix_claimed':False,
                      'installation_changes_only':['switch/wine/wine-nx-runtime.nro']}
              (out/'BUILD-REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
              for folder in [out,symbols_dir]:
                  (folder/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(folder.iterdir()) if p.is_file() and p.name!='SHA256SUMS.txt'))
              print(json.dumps(report,indent=2))
          
          if __name__=='__main__':
              p=argparse.ArgumentParser(description=__doc__);p.add_argument('root',type=Path);p.add_argument('cloud',type=Path);p.add_argument('llvm',type=Path)
              args=p.parse_args();collect(args.root,args.cloud,args.llvm)
          P3R_FILE_7_END
          python3 "$CLOUD_ROOT/p3r-source/patch_runtime.py" "$GITHUB_WORKSPACE/autorun" "$CLOUD_ROOT/p3r-source/p3r_wait_diag.h" "$CLOUD_ROOT/diagnostics" --build-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 "$CLOUD_ROOT/p3r-source/run_checks.py" "$GITHUB_WORKSPACE/autorun" "$CLOUD_ROOT/p3r-source" "$CLOUD_ROOT/diagnostics/host-checks"

      - name: Ensure Linux LLVM tools before compilation
        run: |
          set -euo pipefail
          if [[ ! -x "$WINE_NX_LLVM_MINGW/bin/llvm-readobj" ]]; then
            mkdir -p "$GITHUB_WORKSPACE/autorun/horizon-wine/toolchains"
            curl -fL --retry 3 -o "$CLOUD_ROOT/llvm-mingw.tar.xz" https://github.com/mstorsjo/llvm-mingw/releases/download/20260505/llvm-mingw-20260505-ucrt-ubuntu-22.04-x86_64.tar.xz
            tar -xJf "$CLOUD_ROOT/llvm-mingw.tar.xz" -C "$GITHUB_WORKSPACE/autorun/horizon-wine/toolchains"
            rm "$CLOUD_ROOT/llvm-mingw.tar.xz"
          fi
          for tool in llvm-readobj arm64ec-w64-mingw32-clang aarch64-w64-mingw32-clang i686-w64-mingw32-clang x86_64-w64-mingw32-clang x86_64-w64-mingw32-windres; do
            test -x "$WINE_NX_LLVM_MINGW/bin/$tool"
          done
          "$WINE_NX_LLVM_MINGW/bin/llvm-readobj" --version > "$CLOUD_ROOT/diagnostics/llvm-readobj-version.txt"

      - name: Build AMD64 + FEX + Vulkan + VKD3D
        timeout-minutes: 300
        working-directory: autorun
        run: |
          set -euo pipefail
          case "$BUILD_JOBS" in 2|4) ;; *) exit 1 ;; esac
          # Default build is x64. Do not pass --x86.
          sh build.sh --jobs "$BUILD_JOBS" 2>&1 | tee "$CLOUD_ROOT/diagnostics/build.log"

      - name: Check reusable outputs even if runtime compilation failed
        id: reusable-outputs
        if: always()
        run: |
          toolchain="$GITHUB_WORKSPACE/autorun/horizon-wine/toolchains/llvm-mingw-20260505-ucrt-ubuntu-22.04-x86_64"
          bundle="$GITHUB_WORKSPACE/autorun/horizon-wine/toolchains/boot-payloads/bundle"
          if [[ -x "$toolchain/bin/aarch64-w64-mingw32-clang" && -s "$bundle/setup_boot_manifest.h" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save completed tools even if runtime compilation failed
        if: always() && steps.reusable-outputs.outputs.ready == 'true' && steps.reusable-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            autorun/horizon-wine/toolchains/llvm-mingw-20260505-ucrt-ubuntu-22.04-x86_64
            autorun/horizon-wine/toolchains/boot-payloads/bundle
          key: autorun-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.AUTORUN_REVISION }}-2f1c7e14e601

      - name: Validate NRO-only update and matching native symbols
        run: |
          set -euo pipefail
          python3 "$CLOUD_ROOT/p3r-source/collect_runtime.py" "$GITHUB_WORKSPACE/autorun" "$CLOUD_ROOT" "$WINE_NX_LLVM_MINGW" 2>&1 | tee "$CLOUD_ROOT/diagnostics/package-check.log"
          cat "$CLOUD_ROOT/dist/BUILD-REPORT.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve build diagnostics
        if: always()
        env:
          BUILD_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$CLOUD_ROOT/diagnostics"
          printf '%s\n' "$BUILD_JOB_STATUS" > "$CLOUD_ROOT/diagnostics/job-status.txt"
          df -h > "$CLOUD_ROOT/diagnostics/disk-after.txt"
          for item in horizon-wine/build-switch-amd64/CMakeCache.txt horizon-wine/build-switch-amd64/switch-dev.json horizon-wine/build-wine-amd64-pe/config.log; do
            if [[ -f "$GITHUB_WORKSPACE/autorun/$item" ]]; then
              cp "$GITHUB_WORKSPACE/autorun/$item" "$CLOUD_ROOT/diagnostics/$(basename "$item")"
            fi
          done

      - name: Downloadable NRO-only runtime update
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autorun-p3r-runtime-${{ github.run_id }}
          path: cloud-work/dist/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Downloadable logs (also on failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autorun-p3r-logs-${{ github.run_id }}
          path: cloud-work/diagnostics/
          retention-days: 30
          if-no-files-found: warn

      - name: Downloadable native symbols for this exact NRO
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autorun-p3r-symbols-${{ github.run_id }}
          path: cloud-work/symbols/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
