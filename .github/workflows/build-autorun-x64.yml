                  if (!p3r_diag_read( p3r_diag_waits + i, &current ) ||
                      now < current.started_ns || now - current.started_ns < 1000000000ULL) continue;
                  active++;
                  snprintf( line, sizeof(line),
                            "[P3R-WAIT] tid=%llu kind=%llu addr=%#llx expected=%#llx timeout_ns=%lld "
                            "age_ms=%llu key=%#llx object=%#llx caller=%#llx native_base=%#llx "
                            "caller_offset=%#llx rounds=%llu last_rc=%#llx",
                            (unsigned long long)current.tid, (unsigned long long)current.kind,
                            (unsigned long long)current.address, (unsigned long long)current.expected,
                            (long long)current.timeout_ns, (unsigned long long)((now-current.started_ns)/1000000),
                            (unsigned long long)current.key, (unsigned long long)current.object,
                            (unsigned long long)current.caller, (unsigned long long)base,
                            (unsigned long long)(base && current.caller >= base ? current.caller-base : 0),
                            (unsigned long long)current.rounds, (unsigned long long)current.last_rc );
                  wine_nx_runtime_trace( line );
                  if (p3r_diag_word( current.key, &word )) {
                      snprintf( line, sizeof(line), "[P3R-WAIT-WORD] tid=%llu key=%#llx word64=%#llx",
                                (unsigned long long)current.tid, (unsigned long long)current.key,
                                (unsigned long long)word );
                      wine_nx_runtime_trace( line );
                  }
                  if (current.kind == 1) p3r_pe_report(current.serial, (unsigned)current.tid);
                  /* Retained wake requests for this address, including kernel result. */
                  for (j = 0; j < P3R_DIAG_SLOTS; ++j) {
                      struct p3r_diag_snapshot wake;
                      if (!p3r_diag_read( p3r_diag_events + j, &wake ) || wake.kind != 32 ||
                          wake.address != current.address) continue;
                      snprintf( line, sizeof(line),
                                "[P3R-WAKE-MATCH] waiter=%llu waker=%llu count=%llu rc=%#llx "
                                "when_ns=%llu wait_start_ns=%llu",
                                (unsigned long long)current.tid, (unsigned long long)wake.tid,
                                (unsigned long long)wake.expected, (unsigned long long)wake.last_rc,
                                (unsigned long long)wake.started_ns, (unsigned long long)current.started_ns );
                      wine_nx_runtime_trace( line );
                  }
              }
              if (!active) return;
              for (i = 0; i < P3R_DIAG_SLOTS; ++i)
                  if (p3r_diag_read( p3r_diag_events + i, events + count ) && events[count].serial > last_events)
                      count++;
              for (i = 1; i < count; ++i)
                  for (j = i; j && events[j-1].serial > events[j].serial; --j) {
                      swap = events[j-1]; events[j-1] = events[j]; events[j] = swap;
                  }
              for (i = count > 16 ? count-16 : 0; i < count; ++i) {
                  struct p3r_diag_snapshot *s = events + i;
                  snprintf( line, sizeof(line),
                            "[P3R-WAIT-EVENT] serial=%llu tid=%llu kind=%llu addr=%#llx "
                            "key=%#llx count_or_expected=%#llx rc=%#llx when_ns=%llu",
                            (unsigned long long)s->serial, (unsigned long long)s->tid,
                            (unsigned long long)s->kind, (unsigned long long)s->address,
                            (unsigned long long)s->key, (unsigned long long)s->expected,
                            (unsigned long long)s->last_rc, (unsigned long long)s->started_ns );
                  wine_nx_runtime_trace( line );
                  last = s->serial;
              }
              if (last) last_events = last;
