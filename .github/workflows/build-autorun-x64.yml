              with ZipFile(archive,'a',ZIP_DEFLATED) as z:z.write(decoded,decoded.name)
            except (OSError,ValueError,KeyError) as e:
             (folder/'analysis-error.txt').write_text(str(e)+'\n')
             print('Снимок сохранён; автоматический разбор неполон:',str(e),flush=True)
            symbol_root=Path(__file__).resolve().parent/'symbols'
            with ZipFile(archive,'a',ZIP_DEFLATED,compresslevel=6) as z:
             for name in ['runtime-symbols.json','wine-nx-runtime.elf','ntdll.dll','libarm64ecfex.dll','source-lock.json','p3r-wait-source-lock.json']:
              item=symbol_root/name
              if item.is_file() and not item.is_symlink():z.write(item,'symbols/'+name)
            print('Диагностика сохранена:',archive,flush=True)
            if a.runtime:
             report=json.loads(a.report.read_text())
             result=install(sd,a.runtime,report,a.output)
             (folder/'installation.json').write_text(json.dumps(result,indent=2)+'\n')
             print('NRO обновлён, прежний сохранён в backups.' if result['changed'] else 'На карте уже стоит этот NRO.',flush=True)
            if a.mode!='import':print('Можно безопасно извлечь карту средствами macOS и запустить Persona.',flush=True)
           if a.mode=='import':process(None);return
