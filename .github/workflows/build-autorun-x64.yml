              }
              for (i=0; i<8; ++i) assert(!pthread_create(writers+i, NULL, writer, (void *)(uintptr_t)(i+1)));
              while (P3R_DIAG_LOAD(&done)!=8) {
                  for (i=0; i<P3R_DIAG_SLOTS; ++i) {
                      if (p3r_diag_read(p3r_diag_waits+i,&read)) {
                          assert(read.kind==1 && read.address==read.tid*32 && read.expected==read.tid*47 && read.key==read.tid*71);
