              }
              __atomic_add_fetch(&done, 1, __ATOMIC_RELEASE);
              return NULL;
          }
          
          int main(void)
          {
              pthread_t writers[8];
              struct p3r_diag_snapshot s={0}, read;
              unsigned i, active=0, events=0;
              int slots[P3R_DIAG_SLOTS];
              s.tid=9; s.address=0x1234; s.timeout_ns=(uint64_t)-1; s.kind=2;
