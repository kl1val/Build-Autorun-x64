              { extern void wine_nx_p3r_autopsy(uint64_t tid,uint64_t object,uint64_t key);
                result=p3r_pe_find_wait(nt_base,tid,p3r_pe_native_read,0,&s);
                wine_nx_p3r_autopsy(tid,result==1?(s.lock?s.lock:s.address):0,result==1?s.address:0); }
              for (i=0;i<count;i++) if (reported[i]==serial) return;
              if (count==8) return;
              reported[count++]=serial;
              if (result!=1) {
                  snprintf(line,sizeof(line),"[P3R-PE-WAIT] tid=%u result=%s; no PE layout guessed",tid,
                           result<0?"DLL-fingerprint-mismatch":"entry-not-found-or-changing");
                  wine_nx_runtime_trace(line);return;
              }
              p3r_pe_name(s.address,where,sizeof(where));
              p3r_pe_name(s.caller,caller,sizeof(caller));
              p3r_pe_name(s.upper_return,upper,sizeof(upper));
              snprintf(line,sizeof(line),"[P3R-PE-WAIT] tid=%u address=%#llx where=%s value_valid=%u value64=%#llx "
                       "entry=%#llx caller=%s upper=%s kind=%u",tid,(unsigned long long)s.address,where,
                       s.value_valid,(unsigned long long)s.value,(unsigned long long)s.entry,caller,upper,s.kind);
              wine_nx_runtime_trace(line);
              snprintf(line,sizeof(line),"[P3R-PE-LOCK] tid=%u lock=%#llx valid=%u value64=%#llx "
                       "saved_x19=%#llx saved_x20=%#llx saved_x21=%#llx saved_x22=%#llx "
                       "note=advisory-no-owner-inferred",tid,(unsigned long long)s.lock,s.lock_valid,
                       (unsigned long long)s.lock_value,(unsigned long long)s.saved[0],(unsigned long long)s.saved[1],
                       (unsigned long long)s.saved[2],(unsigned long long)s.saved[3]);
              wine_nx_runtime_trace(line);
              /* Bounded fallback above frame-pointer-free ARM64EC frames. These are
               * executable BL/BLR return candidates, never claimed as unwound frames.
               * No raw stack contents or arbitrary strings are emitted. */
              for (i=0;i<512 && found<16;i++) {
                  uint64_t at=s.caller_sp+i*8ULL,value;
                  MemoryInfo info;u32 page,instruction;
                  if (at<s.caller_sp || !p3r_pe_read64(p3r_pe_native_read,0,at,&value)) break;
                  if (value<4 || value>=0x8000000000ULL || (value&3) ||
                      R_FAILED(svcQueryMemory(&info,&page,value-4)) || !(info.perm&4) ||
                      !p3r_pe_native_read(0,value-4,&instruction,4) ||
                      ((instruction&0xfc000000)!=0x94000000 && (instruction&0xfffffc1f)!=0xd63f0000)) continue;
                  p3r_pe_name(value,where,sizeof(where));
                  snprintf(line,sizeof(line),"[P3R-PE-CANDIDATE] tid=%u slot=%#llx value=%s "
                           "note=stack-code-candidate-not-unwound",tid,(unsigned long long)at,where);
                  wine_nx_runtime_trace(line);found++;
              }
          }
          
          void horizon_p3r_report_waits(void)
          {
              struct p3r_diag_snapshot current, events[P3R_DIAG_SLOTS], swap;
              uint64_t now = p3r_diag_now(), word, base = 0, last = 0;
