          def collect_logs(logs,output,trace=None):
           """Import a completed OpenMTP copy, or the logs directory on a mounted SD."""
           if logs.is_symlink():raise ValueError('Logs directory is a symlink')
           if not logs.is_dir():raise ValueError('Logs directory does not exist')
           stamp=time.strftime('%Y%m%d-%H%M%S')+'-'+uuid.uuid4().hex[:6]
           folder=output/('P3R-Diagnostics-'+stamp);folder.mkdir(parents=True)
           wanted=[]
           if logs.is_dir():
            for p in logs.iterdir():
             if p.name in ['autorun_runtime.log','autorun-setup.log','horizon-trace.log','stdout.txt','stderr.txt'] or re.fullmatch(r'P3R[^/]*\.log|p3r-autopsy-[12]\.p3rdump',p.name):wanted.append(p)
           if trace is not None and trace.is_file():wanted.append(trace)
           manifest={'collected_at':stamp,'files':{},'skipped':{},'switch_files_modified':False}
           for p in sorted(wanted):
            if p.is_symlink() or not p.is_file():manifest['skipped'][p.name]='not a regular file';continue
            if p.stat().st_size>64*1024*1024:manifest['skipped'][p.name]='larger than 64 MiB';continue
            dst=folder/p.name;shutil.copyfile(p,dst)
            source_hash=digest(p)
            if digest(dst)!=source_hash:raise IOError('Readback mismatch while collecting '+p.name)
            manifest['files'][p.name]={'bytes':dst.stat().st_size,'sha256':source_hash,'source_mtime_ns':p.stat().st_mtime_ns}
           (folder/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
           archive=folder.with_suffix('.zip')
           with ZipFile(archive,'w',ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(folder.iterdir()):z.write(p,p.name)
           with ZipFile(archive) as z:
            if z.testzip():raise IOError('Corrupt collected ZIP')
           return folder,archive
          
          def verified_runtime(runtime,report):
           expected=report.get('native_runtime_sha256','')
           if not re.fullmatch('[0-9a-f]{64}',expected):raise ValueError('A matching BUILD-REPORT.json is required')
           with ZipFile(runtime) as z:
            if z.namelist()!=[NRO_MEMBER]:raise ValueError('Runtime ZIP must contain exactly one known NRO')
            entry=z.getinfo(NRO_MEMBER)
            if entry.file_size>128*1024*1024 or (entry.external_attr>>16)&0o170000==0o120000:raise ValueError('Invalid NRO archive member')
            data=z.read(NRO_MEMBER)
           if len(data)<128 or data[16:20]!=b'NRO0' or b'[P3R-AUTOPSY]' not in data:raise ValueError('Not the unified diagnostic NRO')
           if hashlib.sha256(data).hexdigest()!=expected:raise ValueError('NRO does not match build report')
           return data,expected
          
          def prepare_mtp(runtime,report,output):
           data,expected=verified_runtime(runtime,report)
