           target.write_bytes(data)
           if digest(target)!=expected:raise IOError('Local MTP update readback mismatch')
           return target
          
          def install(sd,runtime,report,output):
           wine=sd_wine(sd);target=wine/'wine-nx-runtime.nro'
           data,expected=verified_runtime(runtime,report)
           if target.is_symlink() or not target.is_file():raise ValueError('Existing NRO must be a regular file')
           old=digest(target)
           if old==expected:return {'changed':False,'sha256':old}
           backups=output/'backups';backups.mkdir(parents=True,exist_ok=True)
           backup=backups/(old+'.nro')
