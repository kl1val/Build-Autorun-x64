          #include <assert.h>
          #include <pthread.h>
          #include <stdio.h>
          #include <string.h>
          #include "p3r_wait_diag.h"
          
          static uint64_t done;
          static void *writer(void *arg)
          {
              uint64_t id = (uintptr_t)arg, i;
              for (i=0; i<20000; ++i) {
                  struct p3r_diag_snapshot s = {0};
