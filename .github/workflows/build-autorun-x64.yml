           if a.mode=='import' and a.runtime:p.error('import never installs a runtime')
           if a.mode=='prepare-mtp':
            print('Готовый NRO для OpenMTP:',prepare_mtp(a.runtime,json.loads(a.report.read_text()),a.output));return
           def process(sd):
            folder,archive=collect_logs(a.logs,a.output) if a.mode=='import' else collect(sd,a.output)
