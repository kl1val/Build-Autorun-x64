          df -h > "$CLOUD_ROOT/diagnostics/disk-after.txt"
          for item in horizon-wine/build-switch-amd64/CMakeCache.txt horizon-wine/build-switch-amd64/switch-dev.json horizon-wine/build-wine-amd64-pe/config.log; do
            if [[ -f "$GITHUB_WORKSPACE/autorun/$item" ]]; then
              cp "$GITHUB_WORKSPACE/autorun/$item" "$CLOUD_ROOT/diagnostics/$(basename "$item")"
            fi
          done

      - name: Downloadable complete P3R debugger
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autorun-p3r-debugger-${{ github.run_id }}
          path: cloud-work/download/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Downloadable logs (also on failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autorun-p3r-logs-${{ github.run_id }}
          path: cloud-work/diagnostics/
          retention-days: 30
          if-no-files-found: warn

